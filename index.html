<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Utensilios de Cocina</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e9ecef;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
        }
        p.subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9em;
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍳 Lista de Utensilios de Cocina</h1>
        <p class="subtitle">Gestión y control de utensilios y electrodomésticos.</p>
        
        <div id="content">
            <p>Bienvenido al sistema de control de utensilios de cocina. Aquí puedes visualizar y gestionar todos los elementos asignados.</p>
            <!-- Puedes reemplazar o integrar el contenido completo de tu archivo local aquí -->
        </div>

        <div class="footer">
            <p>Publicado con GitHub Pages</p>
        </div>
    </div>
</body>
</html>
